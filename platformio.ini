; ==============================================================================
; PlatformIO Project Configuration File
; ==============================================================================

; --- GLOBAL ENVIRONMENT (Applies to all build targets) ---
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time, default
build_flags = 
    -I include/ ; Exposes the global System_Config.h header across all libraries

; --- TARGET ENVIRONMENT: Arduino Nano (ATmega328P) ---
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L

; --- HARDWARE UPLOAD SETTINGS ---
upload_protocol = arduino
upload_port = COM9
upload_speed = 115200

; --- AUTOMATION & POST-PROCESSING HOOKS ---
; Automatically runs our Python script to launch the 3D visualizer immediately after flashing
extra_scripts = post:tools/scripts/launch_visualizer.py

; ==============================================================================
; DEVELOPER QUICK-REFERENCE: PYTHON ENVIRONMENT SETUP
; To install required PC telemetry dependencies inside PlatformIO's isolated env,
; execute this command directly in your VS Code terminal:
;
; & "C:\Users\'USER_NAME'\.platformio\penv\Scripts\python.exe" -m pip install pygame pyserial
; ==============================================================================